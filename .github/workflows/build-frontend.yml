name: Create Release

'on':
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Optional semver tag for the release (e.g. v0.4.2). If empty, uses the semver tag on HEAD; fails if HEAD is not tagged.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          INPUT_TAG='${{ github.event.inputs.version_tag }}'
          HEAD_TAG=$(git describe --tags --exact-match HEAD 2>/dev/null || true)

          if [[ -n "$INPUT_TAG" ]]; then
            VERSION="$INPUT_TAG"
          elif [[ -n "$HEAD_TAG" ]]; then
            VERSION="$HEAD_TAG"
          else
            echo "Error: no version tag found (HEAD is not a tag, and no version_tag input provided)"
            exit 1
          fi

          NORMALIZED_VERSION="${VERSION#v}"

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "NORMALIZED_VERSION=$NORMALIZED_VERSION" >> $GITHUB_OUTPUT
          echo "SOURCE_OF_TRUTH=git_tag" >> $GITHUB_OUTPUT
          echo "Using release version: $VERSION"
          echo "Normalized version: $NORMALIZED_VERSION"
          echo "Source of truth: git tag"

      - name: Detect trigger type
        id: trigger
        shell: bash
        run: |
          REF='${{ github.ref }}'
          EVENT='${{ github.event_name }}'
          # This workflow only runs on tag pushes or manual dispatch — always a full release
          if [[ "$REF" == refs/tags/* ]]; then
            echo "TYPE=release" >> $GITHUB_OUTPUT
            echo "Trigger: tag push (${REF#refs/tags/}) → full release"
          elif [[ "$EVENT" == "workflow_dispatch" ]]; then
            echo "TYPE=release" >> $GITHUB_OUTPUT
            echo "Trigger: manual dispatch → full release"
          else
            echo "TYPE=release" >> $GITHUB_OUTPUT
            echo "Trigger: unexpected event ($EVENT) → treat as release"
          fi

      - name: Validate release version
        if: steps.trigger.outputs.TYPE == 'release'
        shell: bash
        run: |
          VERSION='${{ steps.version.outputs.VERSION }}'
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-.*)?$ ]]; then
            echo "ERROR: Invalid release version: $VERSION"
            exit 1
          fi
          echo "Release version $VERSION is valid."

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: cli/go/go.sum

      - name: Run Go tests
        run: cd cli/go && go test ./... -count=1 -short

      - name: Run Go linter (go vet)
        run: cd cli/go && go vet ./...

      - name: Build Go TUI binary (linux/arm64)
        run: |
          V="${{ steps.version.outputs.NORMALIZED_VERSION }}"
          cd cli/go
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -ldflags="-s -w -X main.version=$V" \
            -trimpath -o ../../bin/e3cnc-tui-arm64 ./cmd/e3cnc-tui/
          echo "Go TUI binary built for linux/arm64:"
          ls -lh ../../bin/e3cnc-tui-arm64

      - name: Build Go TUI binary (linux/amd64)
        run: |
          V="${{ steps.version.outputs.NORMALIZED_VERSION }}"
          cd cli/go
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -ldflags="-s -w -X main.version=$V" \
            -trimpath -o ../../bin/e3cnc-tui-amd64 ./cmd/e3cnc-tui/
          echo "Go TUI binary built for linux/amd64:"
          ls -lh ../../bin/e3cnc-tui-amd64

      - name: Generate binary checksums
        run: |
          cd bin
          for f in e3cnc-tui-arm64 e3cnc-tui-amd64; do
            if [ -f "$f" ]; then
              sha256sum "$f" > "$f.sha256"
              echo "Checksum: $f.sha256 ($(cat "$f.sha256"))"
            fi
          done

      - name: Write version.json into dist
        run: |
          echo "{\"buildTime\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"commit\":\"${{ github.sha }}\"}" > dist/version.json

      - name: Create dist archive
        run: |
          cp ./remote/* ./dist/ 2>/dev/null || true
          cd dist && zip -r ../E3CNC-${{ steps.version.outputs.NORMALIZED_VERSION }}.zip . && cd ..

      - name: Install zstd
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd

      - name: Build stack artifact
        shell: bash
        run: |
          VERSION='${{ steps.version.outputs.NORMALIZED_VERSION }}'
          STACK_DIR="e3cnc-stack-${VERSION}"
          mkdir -p "${STACK_DIR}/vendor/moonraker" \
                   "${STACK_DIR}/vendor/klipper" \
                   "${STACK_DIR}/frontend" \
                   "${STACK_DIR}/config/macros" \
                   "${STACK_DIR}/scripts" \
                   "${STACK_DIR}/migrations" \
                   "${STACK_DIR}/bin"

          # Frontend (built assets)
          cp -r dist/* "${STACK_DIR}/frontend/"

          # Full vendored Moonraker — includes cnc_agent, cnc_metadata, MCP already integrated
          cp -r vendor/moonraker/* "${STACK_DIR}/vendor/moonraker/"

          # Full vendored Klipper — includes work_coordinate_systems.py already in klippy/extras/
          cp -r vendor/klipper/* "${STACK_DIR}/vendor/klipper/"

          # Macros (merge with post_processors)
          cp config/macros/*.cfg "${STACK_DIR}/config/macros/"
          if [ -d docs/post-processors/klipper/macros ]; then
            cp docs/post-processors/klipper/macros/*.cfg "${STACK_DIR}/config/macros/"
          fi

          # Scripts
          cp scripts/cnc_metadata_extractor.py "${STACK_DIR}/scripts/"

          # Go TUI binary (multi-arch)
          for arch in arm64 amd64; do
            src="bin/e3cnc-tui-${arch}"
            if [ -f "$src" ]; then
              cp "$src" "${STACK_DIR}/bin/e3cnc-tui-${arch}"
              echo "  Included e3cnc-tui-${arch} in stack artifact ($(ls -lh "$src" | awk '{print $5}'))"
            fi
          done

          # Bootstrap template
          cp -r config/bootstrap "${STACK_DIR}/config/bootstrap"

          # Theme
          cp config/theme.json "${STACK_DIR}/"

          # Write manifest.json
          echo "{\"e3cnc_version\": \"${VERSION}\", \"moonraker_component_version\": \"${VERSION}\", \"klipper_extras_version\": \"1\", \"config_schema\": 1, \"klipper_requires\": \">=0.12.0\", \"python_requires\": \">=3.9\"}" > "${STACK_DIR}/manifest.json"

          # Create compressed archive
          tar --zstd -cf "e3cnc-stack-${VERSION}.tar.zst" "${STACK_DIR}"

          # Checksum
          sha256sum "e3cnc-stack-${VERSION}.tar.zst" > "e3cnc-stack-${VERSION}.tar.zst.sha256"

          echo "Stack artifact built: e3cnc-stack-${VERSION}.tar.zst ($(du -h "e3cnc-stack-${VERSION}.tar.zst" | cut -f1))"

      - name: Upload stack artifact (CI artifact, release builds only)
        if: steps.trigger.outputs.TYPE == 'release'
        uses: actions/upload-artifact@v5
        with:
          name: stack-artifact
          path: e3cnc-stack-*.tar.zst*
          retention-days: 90

      - name: Upload dist artifact
        uses: actions/upload-artifact@v5
        with:
          name: frontend-dist
          path: dist/
          retention-days: 30

      - name: Validate manifest version (no `v` prefix guard)
        shell: bash
        run: |
          STACK_DIR=$(ls -d e3cnc-stack-* 2>/dev/null | head -1)
          if [[ -z "$STACK_DIR" ]]; then
            echo "No stack artifact directory found, skipping manifest validation"
            exit 0
          fi
          MANIFEST="${STACK_DIR}/manifest.json"
          if [[ ! -f "$MANIFEST" ]]; then
            echo "Warning: manifest.json not found in $STACK_DIR"
            exit 0
          fi
          VERSION=$(jq -r '.e3cnc_version // empty' "$MANIFEST" 2>/dev/null)
          if [[ -z "$VERSION" ]]; then
            echo "Warning: e3cnc_version not found in manifest"
            exit 0
          fi
          if [[ "$VERSION" == v* ]]; then
            echo "ERROR: manifest.json e3cnc_version contains 'v' prefix: '$VERSION'"
            echo "The version in the manifest must be normalized (no leading 'v')."
            echo "The version is derived from the raw tag; your step should strip the 'v' before writing."
            exit 1
          fi
          echo "Manifest version validated: $VERSION (no 'v' prefix)"

      - name: Get short commit SHA
        id: commit
        run: echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Write release notes
        if: steps.trigger.outputs.TYPE == 'release'
        run: |
          VERSION='${{ steps.version.outputs.VERSION }}'
          echo "### What's Changed" > release-notes.md
          echo "" >> release-notes.md
          python3 scripts/build/_get_changelog_entry.py "$VERSION" >> release-notes.md 2>/dev/null \
            || echo "  See the [CHANGELOG](https://github.com/E3CNC/E3CNC/blob/main/CHANGELOG.md) for details." >> release-notes.md

      - name: Auto-update CHANGELOG (git-cliff)
        if: steps.trigger.outputs.TYPE == 'release'
        shell: bash
        run: |
          # Checkout main branch (workflow checks out tag ref, detached HEAD)
          git checkout main
          # Install git-cliff — prefer cargo, fall back to pre-built binary
          cargo install git-cliff -q 2>/dev/null || \
            (curl -fsSL https://github.com/orhun/git-cliff/releases/latest/download/git-cliff-x86_64-unknown-linux-gnu.tar.gz | tar xz && chmod +x git-cliff)
          CLIFF=$(command -v git-cliff || echo "./git-cliff")
          git config user.name "E3CNC CI"
          git config user.email "ci@e3cnc.local"
          # Prepend unreleased commits as new version section
          $CLIFF --unreleased --tag "$(git describe --tags --exact-match HEAD)" --prepend CHANGELOG.md 2>/dev/null || \
            echo "No new changelog entries to add (may have been seeded already)."
          # Stage first, then check the staged diff. git-cliff --prepend only
          # touches the working tree, so checking `git diff --cached` before
          # `git add` (or checking unstaged diff of a tracked file) is always
          # empty and the commit silently never happens.
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changelog changes to commit."
          else
            git commit -m "chore: update CHANGELOG for $(git describe --tags --exact-match HEAD)"
            git push origin main
          fi

      - name: Guard — stack artifact must exist before publishing
        shell: bash
        run: |
          VERSION='${{ steps.version.outputs.NORMALIZED_VERSION }}'
          STACK_ARTIFACT="e3cnc-stack-${VERSION}.tar.zst"
          if [[ ! -f "$STACK_ARTIFACT" ]]; then
            echo "ERROR: Stack artifact not found: $STACK_ARTIFACT"
            echo "The publish step requires the stack artifact. Something went wrong in the build."
            echo "Available files:"
            ls -la *.tar.zst* 2>/dev/null || echo "  (none)"
            exit 1
          fi
          echo "Stack artifact exists: $STACK_ARTIFACT ($(du -h "$STACK_ARTIFACT" | cut -f1))"

      - name: Publish release (tag / manual dispatch)
        if: steps.trigger.outputs.TYPE == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG='${{ steps.version.outputs.VERSION }}'
          VERSION='${{ steps.version.outputs.NORMALIZED_VERSION }}'
          ASSET="E3CNC-${VERSION}.zip"
          STACK_ARTIFACT="e3cnc-stack-${VERSION}.tar.zst"
          STACK_CHECKSUM="e3cnc-stack-${VERSION}.tar.zst.sha256"
          BINARY_ARM64="bin/e3cnc-tui-arm64"
          BINARY_AMD64="bin/e3cnc-tui-amd64"

          RELEASE_ARGS=(
            --title "${TAG} (${{ steps.commit.outputs.SHA_SHORT }})"
            --notes-file release-notes.md
            --target main
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating existing release: $TAG"
            gh release upload "$TAG" "$ASSET" "$STACK_ARTIFACT" "$STACK_CHECKSUM" "$BINARY_ARM64" "$BINARY_ARM64.sha256" "$BINARY_AMD64" "$BINARY_AMD64.sha256" --clobber
            gh release edit "$TAG" "${RELEASE_ARGS[@]}"
          else
            echo "Creating release: $TAG"
            gh release create "$TAG" \
              "${RELEASE_ARGS[@]}" \
              "$ASSET" \
              "$STACK_ARTIFACT" \
              "$STACK_CHECKSUM" \
              "$BINARY_ARM64" \
              "$BINARY_ARM64.sha256" \
              "$BINARY_AMD64" \
              "$BINARY_AMD64.sha256"
          fi
