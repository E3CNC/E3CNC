# E3CNC Moonraker dev config for Docker simulator
#
# Mirrors production config (config/moonraker/moonraker.conf.example)
# with debug mode enabled, ephemeral database, and no update manager.
# Database path is set via CLI arg (-d /tmp/moonraker-data) in entrypoint.

[server]
host: 0.0.0.0
port: 7125
enable_debugging: True
klippy_uds_address: /tmp/klippy_uds

[data_store]

[file_manager]
enable_object_processing: True

[authorization]
trusted_clients:
    0.0.0.0/0
    ::1/128
cors_domains:
    http://localhost:5173
    http://localhost:5174
    http://localhost:3000
    http://localhost:8000
    http://127.0.0.1:5173

[cnc_agent]
# Dev mode — no machine profile, default settings

[cnc_metadata]
extractor_path: /app/config/macros/cnc_metadata_extractor.py
timeout: 30.0

[update_manager]
enable_auto_update: False
enable_system_sudo: False