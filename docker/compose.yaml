services:
  moonraker-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: e3cnc-moonraker-dev
    ports:
      - "7125:7125"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/entrypoint.sh", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s