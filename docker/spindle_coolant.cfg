# Spindle & coolant state tracking for the E3CNC Docker simulator.
#
# The vendored Klipper in this repo does NOT ship the [spindle] or
# [coolant] modules (they were never part of this fork / version). To still
# give the UI real state transitions for CNC control, we implement
# M3/M4/M5 (spindle) and M7/M8/M9 (coolant) as gcode macros that track
# state into a single shared variables object (_CNC_STATE).
#
# Hardware is a NOOP (the simulator MCU has stub GPIO), but the state is
# real and queryable — e.g. via Moonraker:
#   /printer/objects/query?gcode_macro%20_CNC_STATE
#   --> { "gcode_macro _CNC_STATE": { "spindle_state":"ON",
#         "spindle_speed":5000, "coolant":"FLOOD" } }
#
# This file must be included LAST in printer.cfg so these macro definitions
# override the RESPOND-only stubs in config/macros/e3cnc_macros.cfg.
#
# NOTE on SET_GCODE_VARIABLE string values: the gcode parser strips one level
# of double quotes from parameter values, so string literals are written with
# an extra single-quote wrapper, e.g. VALUE="'ON'".

# ── Shared state ────────────────────────────────────────────────────────────
[gcode_macro _CNC_STATE]
description: CNC spindle/coolant state tracking variables
variable_spindle_state: "OFF"
variable_spindle_speed: 0
variable_coolant: "OFF"
gcode:
    RESPOND PREFIX="info" MSG="CNC state: spindle=[_CNC_STATE.spindle_state]@[_CNC_STATE.spindle_speed] coolant=[_CNC_STATE.coolant]"

# ── Spindle ─────────────────────────────────────────────────────────────────
[gcode_macro M3]
description: Spindle ON clockwise (optionally at speed via S-word)
gcode:
    {% set s = params.S|default(printer['gcode_macro _CNC_STATE'].spindle_speed, true)|int %}
    SET_GCODE_VARIABLE MACRO=_CNC_STATE VARIABLE=spindle_state VALUE="'ON'"
    SET_GCODE_VARIABLE MACRO=_CNC_STATE VARIABLE=spindle_speed VALUE={s}
    RESPOND PREFIX="info" MSG="Spindle ON clockwise at {s} RPM"

[gcode_macro M4]
description: Spindle ON counter-clockwise (optionally at speed via S-word)
gcode:
    {% set s = params.S|default(printer['gcode_macro _CNC_STATE'].spindle_speed, true)|int %}
    SET_GCODE_VARIABLE MACRO=_CNC_STATE VARIABLE=spindle_state VALUE="'ON'"
    SET_GCODE_VARIABLE MACRO=_CNC_STATE VARIABLE=spindle_speed VALUE={s}
    RESPOND PREFIX="info" MSG="Spindle ON counter-clockwise at {s} RPM"

[gcode_macro M5]
description: Spindle OFF
gcode:
    SET_GCODE_VARIABLE MACRO=_CNC_STATE VARIABLE=spindle_state VALUE="'OFF'"
    RESPOND PREFIX="info" MSG="Spindle OFF"

# ── Coolant ──────────────────────────────────────────────────────────────────
[gcode_macro M7]
description: Mist coolant ON
gcode:
    SET_GCODE_VARIABLE MACRO=_CNC_STATE VARIABLE=coolant VALUE="'MIST'"
    RESPOND PREFIX="info" MSG="Mist coolant ON"

[gcode_macro M8]
description: Flood coolant ON
gcode:
    SET_GCODE_VARIABLE MACRO=_CNC_STATE VARIABLE=coolant VALUE="'FLOOD'"
    RESPOND PREFIX="info" MSG="Flood coolant ON"

[gcode_macro M9]
description: Coolant OFF
gcode:
    SET_GCODE_VARIABLE MACRO=_CNC_STATE VARIABLE=coolant VALUE="'OFF'"
    RESPOND PREFIX="info" MSG="Coolant OFF"