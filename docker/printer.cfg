# E3CNC CNC printer config for Klipper simulator MCU
#
# Cartesian kinematics, three stepper axes (X/Y/Z), spindle, coolant,
# work coordinate systems, and E3CNC macros. No extruder or heated bed.
# MCU serial connects via PTY to the simulator binary.

# ── MCU ──────────────────────────────────────────────────────────────────────
[mcu]
serial: /tmp/simulator-pty
baud: 250000
restart_method: command

# ── Printer ──────────────────────────────────────────────────────────────────
[printer]
kinematics: cartesian
max_velocity: 5000
max_accel: 500
max_z_velocity: 500
max_z_accel: 100
square_corner_velocity: 5.0

# ── Stepper X ────────────────────────────────────────────────────────────────
# Pins are numeric because the simulator MCU validates pins as integers (`%c`).
# gpio on the simulator is a stub, so values are cosmetic.
[stepper_x]
step_pin: 0
dir_pin: 1
enable_pin: !2
microsteps: 16
rotation_distance: 40
endstop_pin: ^3
position_endstop: 0
position_min: 0
position_max: 300
homing_speed: 50

# ── Stepper Y ────────────────────────────────────────────────────────────────
[stepper_y]
step_pin: 4
dir_pin: 5
enable_pin: !6
microsteps: 16
rotation_distance: 40
endstop_pin: ^7
position_endstop: 0
position_min: 0
position_max: 200
homing_speed: 50

# ── Stepper Z ────────────────────────────────────────────────────────────────
[stepper_z]
step_pin: 8
dir_pin: 9
enable_pin: !10
microsteps: 16
rotation_distance: 8
endstop_pin: ^11
position_endstop: 0
position_min: -5
position_max: 150
homing_speed: 20

# ── Work Coordinate Systems ──────────────────────────────────────────────────
# Registers G54–G59 (default active is G54) plus G53, G10, WCS_STATUS, SAVE_WCS.
[work_coordinate_systems]
persist_file: /tmp/wcs_offsets.json

# ── Probe ────────────────────────────────────────────────────────────────────
# Virtual probe on a numeric pin; simulator gpio returns 0 (never triggered),
# so probing is a predictable no-op for UI development.
[probe]
pin: 12
x_offset: 0
y_offset: 0
z_offset: 0
speed: 5
samples: 1

# ── Endstops ─────────────────────────────────────────────────────────────────
[endstop_phase]

# ── E3CNC Macros ─────────────────────────────────────────────────────────────
# Order matters: cnc_base.cfg first (defines scaffold macros), then
# wcs_macros.cfg (WCS selection), then e3cnc_macros.cfg last (overrides
# PAUSE/RESUME defaults).
[include config/macros/cnc_base.cfg]
[include config/macros/wcs_macros.cfg]
[include config/macros/e3cnc_macros.cfg]

# Spindle/coolant state tracking (NOOP hardware, real state via variables).
# This vendored Klipper has no [spindle]/[coolant] modules, so M3/M4/M5/M7/M8/M9
# are gcode macros that track state in SET_GCODE_VARIABLE. Must be included
# LAST so these override the RESPOND-only stubs in e3cnc_macros.cfg.
[include spindle_coolant.cfg]

# ── Display (virtual) ────────────────────────────────────────────────────────
[display_status]

# ── Virtual SD Card ──────────────────────────────────────────────────────────
[virtual_sdcard]
path: /tmp

# ── Pause/Resume ─────────────────────────────────────────────────────────────
[pause_resume]

# ── Force Move ───────────────────────────────────────────────────────────────
[force_move]
enable_force_move: True

# ── Respond ──────────────────────────────────────────────────────────────────
[respond]
default_type: echo